<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runika EduPanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --primary:#00B4D8; --pink:#E040FB; --bg:#0F1117; --surface:#1A1D27; --surface2:#21253A;
      --border:rgba(255,255,255,.08); --text:#F0F2FF; --muted:#8B90A7; --verde:#4CAF50; --amarillo:#FFC107; --rojo:#F44336;
      --mat:#4FC3F7; --esp:#FF8A65; --ing:#81C784; --shadow:0 10px 24px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
    body{background:var(--bg);color:var(--text)}
    .hidden{display:none!important}
    .btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
    .btn:hover{filter:brightness(1.06)}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--pink));border:none}
    .btn-sm{padding:5px 8px;font-size:.75rem;border-radius:6px}
    .btn-danger{background:#b71c1c;border:none}
    .badge{padding:4px 8px;border-radius:12px;font-size:.75rem;font-weight:600;display:inline-block}
    .badge-mat{background:rgba(79,195,247,.15);color:var(--mat)}
    .badge-esp{background:rgba(255,138,101,.15);color:var(--esp)}
    .badge-ing{background:rgba(129,199,132,.15);color:var(--ing)}
    .badge-green{background:rgba(76,175,80,.16);color:#8ee39d}
    .badge-yellow{background:rgba(255,193,7,.16);color:#ffd95e}
    .badge-red{background:rgba(244,67,54,.16);color:#ff8f86}
    #loginScreen{height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .login-card{background:var(--surface);padding:32px;border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;box-shadow:var(--shadow)}
    .login-card h1{margin-bottom:8px}
    .login-card p{color:var(--muted);margin-bottom:20px}
    .form-group{margin-bottom:16px}
    .form-group label{display:block;margin-bottom:8px;color:var(--muted);font-size:.9rem}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:.9rem}
    .form-group textarea{min-height:110px;resize:vertical}
    .checkbox-group{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
    .checkbox-item{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
    #appShell{display:flex;height:100vh}
    #sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border)}
    .sidebar-header{padding:20px;font-weight:700;font-size:1.2rem}
    .sidebar-nav a{display:flex;gap:10px;padding:14px 20px;color:var(--muted);text-decoration:none;cursor:pointer}
    .sidebar-nav a.active,.sidebar-nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
    .main-wrapper{flex:1;display:flex;flex-direction:column;min-width:0}
    #topbar{height:70px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
    #mainContent{padding:24px;overflow:auto;flex:1}
    .status-indicator{display:flex;align-items:center;gap:8px;background:var(--surface2);padding:6px 12px;border-radius:20px;font-size:.8rem;white-space:nowrap}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--verde)}
    .status-dot.offline{background:var(--rojo)}
    .view-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
    .teacher-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
    .kpi-card,.chart-card,.table-container,.horario-container,.teacher-panel,.today-card,.note-card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
    .kpi-card,.teacher-panel,.today-card,.note-card{padding:20px}
    .value{font-size:1.8rem;font-weight:700}
    .muted{color:var(--muted)}
    .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .chart-card{padding:20px}
    .chart-container{position:relative;height:260px;width:100%}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
    th{background:var(--surface2);color:var(--muted);font-size:.8rem}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700}
    .user-profile{display:flex;align-items:center;gap:10px;min-width:0}
    .horario-grid{display:grid;grid-template-columns:90px repeat(5,1fr);min-width:850px;font-size:.8rem}
    .horario-header,.horario-time,.horario-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
    .horario-header,.horario-time{background:var(--surface2);padding:8px;font-weight:600}
    .horario-cell{padding:6px;min-height:70px}
    .clase-card{background:var(--surface2);padding:8px;border-radius:8px;font-size:.75rem;border-left:3px solid var(--primary);margin-bottom:6px;cursor:pointer}
    .clase-card:hover{background:#2a3045}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
    .modal-overlay.active{display:flex}
    .modal-content{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .modal-title{margin-bottom:16px}
    .modal-footer{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
    .footer-actions{display:flex;gap:10px}
    .teacher-home-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:20px}
    .today-list,.quick-list{display:grid;gap:10px;margin-top:14px}
    .today-item,.quick-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px}
    .quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .section-title{font-size:1rem;font-weight:700;margin-bottom:8px}
    .note-layout{display:grid;grid-template-columns:360px 1fr;gap:16px}
    .star-row{display:flex;gap:8px;align-items:center}
    .empty-state{padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:1100px){
      .teacher-home-grid,.note-layout,.charts-grid{grid-template-columns:1fr}
    }
    @media(max-width:900px){
      #sidebar{display:none}
      .form-row{grid-template-columns:1fr}
      .horario-grid{min-width:auto;grid-template-columns:60px repeat(5,1fr)}
      #topbar{padding:0 14px}
      #mainContent{padding:14px}
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-card">
      <h1>Runika EduPanel</h1>
      <p>Centro Kumon Ipiales</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Rol de acceso</label>
          <select id="loginRole">
            <option value="admin">Administrador</option>
            <option value="profesor">Profesor</option>
          </select>
        </div>
        <div class="form-group">
          <label>Correo</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <div id="appShell" class="hidden">
    <aside id="sidebar">
      <div class="sidebar-header">EduPanel</div>
      <nav class="sidebar-nav"></nav>
    </aside>
    <div class="main-wrapper">
      <header id="topbar">
        <div class="status-indicator" id="apiStatus">
          <div class="status-dot"></div><span>API Conectada</span>
        </div>
        <div class="user-profile">
          <div>
            <div id="topbarName"></div>
            <div id="topbarRole" class="muted" style="font-size:.8rem"></div>
          </div>
          <div class="avatar" id="topbarAvatar">NA</div>
          <button class="btn" onclick="logout()">Salir</button>
        </div>
      </header>
      <main id="mainContent"></main>
    </div>
  </div>

  <div id="modalProfesor" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title" id="modalProfesorTitle">Nuevo profesor</h2>
      <form id="formProfesor">
        <input type="hidden" id="profId">
        <div class="form-row">
          <div class="form-group"><label>Nombre</label><input id="profNombre" required></div>
          <div class="form-group"><label>Email</label><input id="profEmail" type="email" required></div>
        </div>
        <div class="form-group" id="profPassGroup">
          <label>Contraseña temporal</label>
          <input id="profPass" value="prof123" required>
        </div>
        <div class="form-group">
          <label>Materias asignadas</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="profMat" value="MAT"> Matemáticas</label>
            <label class="checkbox-item"><input type="checkbox" name="profMat" value="ESP"> Español</label>
            <label class="checkbox-item"><input type="checkbox" name="profMat" value="ING"> Inglés</label>
          </div>
        </div>
        <div class="modal-footer" style="justify-content:flex-end">
          <div class="footer-actions">
            <button type="button" class="btn" onclick="cerrarModal('modalProfesor')">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="profSubmitBtn">Guardar Profesor</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="modalEstudiante" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title" id="modalEstudianteTitle">Nuevo estudiante</h2>
      <form id="formEstudiante">
        <input type="hidden" id="estId">
        <div class="form-row">
          <div class="form-group"><label>Nombres</label><input id="estNombres" required></div>
          <div class="form-group"><label>Apellidos</label><input id="estApellidos" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Documento</label><input id="estDoc" required placeholder="Ej: 123456789"></div>
          <div class="form-group"><label>Email</label><input id="estEmail" type="email" required></div>
        </div>
        <div class="form-group">
          <label>Materias inscritas</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="estMat" value="MAT"> Matemáticas</label>
            <label class="checkbox-item"><input type="checkbox" name="estMat" value="ESP"> Español</label>
            <label class="checkbox-item"><input type="checkbox" name="estMat" value="ING"> Inglés</label>
          </div>
        </div>
        <div class="form-group">
          <label>Profesor titular</label>
          <select id="estProfesor" required></select>
        </div>
        <div class="modal-footer" style="justify-content:flex-end">
          <div class="footer-actions">
            <button type="button" class="btn" onclick="cerrarModal('modalEstudiante')">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="estSubmitBtn">Guardar Estudiante</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="modalHorario" class="modal-overlay">
    <div class="modal-content" style="max-width:450px;">
      <h2 class="modal-title" id="modalHorarioTitle">Asignar Horario</h2>
      <form id="formHorario">
        <input type="hidden" id="horarioId">
        <div class="form-group">
          <label>Estudiante</label>
          <select id="horarioEstudiante" required></select>
        </div>
        <div class="form-group">
          <label>Profesor</label>
          <select id="horarioProfesor" required></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Día</label>
            <select id="horarioDia" required>
              <option value="MON">Lunes</option>
              <option value="TUE">Martes</option>
              <option value="WED">Miércoles</option>
              <option value="THU">Jueves</option>
              <option value="FRI">Viernes</option>
            </select>
          </div>
          <div class="form-group">
            <label>Franja Horaria</label>
            <select id="horarioHora" required>
              <option value="08:00:00">08:00</option>
              <option value="09:00:00">09:00</option>
              <option value="10:00:00">10:00</option>
              <option value="14:00:00">14:00</option>
              <option value="15:00:00">15:00</option>
              <option value="16:00:00">16:00</option>
              <option value="17:00:00">17:00</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Materia</label>
          <select id="horarioMateria" required>
            <option value="MAT">Matemáticas</option>
            <option value="ESP">Español</option>
            <option value="ING">Inglés</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger hidden" id="horarioDeleteBtn" onclick="accionEliminarHorario()">Eliminar clase</button>
          <div class="footer-actions">
            <button type="button" class="btn" onclick="cerrarModal('modalHorario')">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="horarioSubmitBtn">Asignar al horario</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="modalNota" class="modal-overlay">
    <div class="modal-content" style="max-width:560px;">
      <h2 class="modal-title">Registrar nota de clase</h2>
      <form id="formNota">
        <div class="form-group">
          <label>Estudiante</label>
          <select id="notaEstudiante" required></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Materia</label>
            <select id="notaMateria" required>
              <option value="MAT">Matemáticas</option>
              <option value="ESP">Español</option>
              <option value="ING">Inglés</option>
            </select>
          </div>
          <div class="form-group">
            <label>Estrellas</label>
            <select id="notaStars" required>
              <option value="5">5</option>
              <option value="4">4</option>
              <option value="3">3</option>
              <option value="2">2</option>
              <option value="1">1</option>
              <option value="0">0</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Observación</label>
          <textarea id="notaObs" required placeholder="Escribe la observación de la clase"></textarea>
        </div>
        <div class="modal-footer" style="justify-content:flex-end;">
          <div class="footer-actions">
            <button type="button" class="btn" onclick="cerrarModal('modalNota')">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar nota</button>
          </div>
        </div>
      </form>
    </div>
  </div>

<script>
const API_BASE = "http://localhost:8000";
let currentUser = null;
let chartMat = null;
let chartSem = null;
let editingProfesorId = null;
let editingEstudianteId = null;
let editingHorarioId = null;
const FRANJAS = ["08:00","09:00","10:00","14:00","15:00","16:00","17:00"];
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes"];

function abrirModal(id){ document.getElementById(id).classList.add("active"); }
function cerrarModal(id){ document.getElementById(id).classList.remove("active"); }
function getInitials(name){ return (name || "NA").split(" ").map(x => x[0]).join("").slice(0,2).toUpperCase(); }
function escapeHtml(str){ return String(str ?? "").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function renderBadges(materias){
  return (materias || []).map(m => {
    const code = String(m).toLowerCase();
    return `<span class="badge badge-${code}">${escapeHtml(m)}</span>`;
  }).join(" ");
}

function normalizarMaterias(materias){
  if (Array.isArray(materias)) return materias;
  if (typeof materias === "string") return materias.replace(/[{}]/g, "").split(",").map(x => x.trim()).filter(Boolean);
  return [];
}

function semaforoBadge(value){
  const v = String(value || '').toLowerCase();
  if(v === 'verde') return '<span class="badge badge-green">Verde</span>';
  if(v === 'amarillo') return '<span class="badge badge-yellow">Amarillo</span>';
  if(v === 'rojo') return '<span class="badge badge-red">Rojo</span>';
  return value || '-';
}

async function api(path, options={}){
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    ...options
  });
  if(!res.ok){
    let detail = "Error";
    try { const j = await res.json(); detail = j.detail || detail; } catch {}
    throw new Error(detail);
  }
  if(res.status === 204) return {};
  return res.json();
}

async function checkBackend(){
  const dot = document.querySelector("#apiStatus .status-dot");
  const span = document.querySelector("#apiStatus span");
  try{ await api("/health"); dot.classList.remove("offline"); span.textContent = "API Conectada"; }
  catch{ dot.classList.add("offline"); span.textContent = "API Offline"; }
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const role = document.getElementById("loginRole").value;
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  try{
    const data = await api("/api/v1/login", { method: "POST", body: JSON.stringify({ role, email, password }) });
    currentUser = { ...data, role, email };
    login(currentUser);
  }catch(err){ alert("Error de acceso: " + err.message); }
});

function login(user){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appShell").classList.remove("hidden");
  document.getElementById("topbarName").textContent = user.name;
  document.getElementById("topbarRole").textContent = user.role === "admin" ? "Administrador" : "Profesor";
  document.getElementById("topbarAvatar").textContent = getInitials(user.name);
  renderSidebar();
  checkBackend();
  navigateTo(user.role === "admin" ? "dashboard" : "teacher-home");
}

function logout(){
  currentUser = null;
  document.getElementById("appShell").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("loginForm").reset();
}

function renderSidebar(){
  const nav = document.querySelector(".sidebar-nav");
  nav.innerHTML = currentUser.role === "admin"
    ? `
      <a onclick="navigateTo('dashboard')" id="nav-dashboard">Dashboard</a>
      <a onclick="navigateTo('estudiantes')" id="nav-estudiantes">Estudiantes</a>
      <a onclick="navigateTo('profesores')" id="nav-profesores">Profesores</a>
      <a onclick="navigateTo('horario')" id="nav-horario">Horario</a>
      <a onclick="navigateTo('diagnosticos')" id="nav-diagnosticos">Diagnósticos</a>
    `
    : `
      <a onclick="navigateTo('teacher-home')" id="nav-teacher-home">Panel docente</a>
      <a onclick="navigateTo('horario')" id="nav-horario">Mi horario</a>
      <a onclick="navigateTo('estudiantes')" id="nav-estudiantes">Mis estudiantes</a>
      <a onclick="navigateTo('notas')" id="nav-notas">Notas</a>
      <a onclick="navigateTo('diagnosticos')" id="nav-diagnosticos">Diagnósticos</a>
    `;
}

function setActive(view){
  document.querySelectorAll(".sidebar-nav a").forEach(a => a.classList.remove("active"));
  const el = document.getElementById(`nav-${view}`);
  if(el) el.classList.add("active");
}

async function navigateTo(view){
  setActive(view);
  if(chartMat){ chartMat.destroy(); chartMat = null; }
  if(chartSem){ chartSem.destroy(); chartSem = null; }
  if(view === "dashboard") return renderDashboard();
  if(view === "teacher-home") return renderTeacherHome();
  if(view === "profesores") return renderProfesores();
  if(view === "estudiantes") return renderEstudiantes();
  if(view === "horario") return renderHorario();
  if(view === "notas") return renderNotas();
  if(view === "diagnosticos") return renderDiagnosticos();
}

async function renderDashboard(){
  const data = await api("/api/v1/dashboard/stats");
  document.getElementById("mainContent").innerHTML = `
    <div class="view-header"><h2>Dashboard General</h2></div>
    <div class="kpi-grid">
      <div class="kpi-card"><div>Total Estudiantes</div><div class="value">${data.totalEstudiantes}</div></div>
      <div class="kpi-card"><div>Profesores</div><div class="value">${data.totalProfesores}</div></div>
      <div class="kpi-card"><div>Clases Hoy</div><div class="value">${data.clasesHoy}</div></div>
      <div class="kpi-card"><div>Boletines</div><div class="value">${data.boletinesGenerados}</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Materias</h3><div class="chart-container"><canvas id="chartMaterias"></canvas></div></div>
      <div class="chart-card"><h3>Semáforo</h3><div class="chart-container"><canvas id="chartSemaforo"></canvas></div></div>
    </div>
  `;
  setTimeout(() => {
    const ctxMat = document.getElementById("chartMaterias");
    const ctxSem = document.getElementById("chartSemaforo");
    if (ctxMat) {
      chartMat = new Chart(ctxMat, {
        type: "doughnut",
        data: { labels: ["Matemáticas", "Español", "Inglés"], datasets: [{ data: [data.materiasMatematicas, data.materiasEspanol, data.materiasIngles], backgroundColor: ["#4FC3F7","#FF8A65","#81C784"] }] },
        options: { maintainAspectRatio:false, plugins:{legend:{labels:{color:'#F0F2FF'}}} }
      });
    }
    if (ctxSem) {
      chartSem = new Chart(ctxSem, {
        type: "bar",

}

async function cargarEstudiantesParaHorario(selectedName = ""){

async function cargarProfesoresParaHorario(selectedName = ""){
  const profesores = await api("/api/v1/profesores-simple");
  const select = document.getElementById("horarioProfesor");
  if (!profesores || profesores.length === 0) { select.innerHTML = `<option value="">No hay profesores disponibles</option>`; return; }
  select.innerHTML = profesores.map(p => {
    const materias = normalizarMaterias(p.materias).join(", ");
    return `<option value="${p.idProfesor}">${escapeHtml(p.nombre)}${materias ? " - " + escapeHtml(materias) : ""}</option>`;
  }).join("");
  if(selectedName){ for(let i=0; i<select.options.length; i++){ if(select.options[i].text.startsWith(selectedName)){ select.selectedIndex = i; break; } } }
}

async function renderHorario(){
  let data;
  if(currentUser.role === "admin") data = await api("/api/v1/horario");
  else data = await getTeacherSchedule();
  const grid = {};
  data.forEach(c => {
    const diaLabel = mapWeekdayCodeToLabel(c.dia);
    const key = `${diaLabel}__${c.horaInicio.slice(0,5)}`;
    if(!grid[key]) grid[key] = [];
    grid[key].push(c);
  });
  let html = "";
  html += `<div class="horario-header"></div>`;
  DIAS.forEach(d => html += `<div class="horario-header">${d}</div>`);
  FRANJAS.forEach(f => {
    html += `<div class="horario-time">${f}</div>`;
    DIAS.forEach(d => {
      const key = `${d}__${f}`;
      const clases = (grid[key] || []).map(c => `
        <div class="clase-card" ${currentUser.role === "admin" ? `onclick='abrirModalEditarHorario(${JSON.stringify(c).replace(/'/g, "&apos;")})'` : ""}>
          <strong>${escapeHtml(c.estudiante)}</strong><br>
          ${renderBadges([c.materia])}
          ${currentUser.role === "admin" ? `<br><small>${escapeHtml(c.profesor)}</small>` : `<br><small>${escapeHtml(c.horaInicio?.slice(0,5) || '')}</small>`}
        </div>
      `);
      html += `<div class="horario-cell">${clases.join("")}</div>`;
    });
  });
  document.getElementById("mainContent").innerHTML = `
    <div class="view-header">
      <h2>${currentUser.role === "admin" ? "Horario General" : "Mi Horario"}</h2>
      ${currentUser.role === "admin" ? `<button class="btn btn-primary" onclick="abrirModalCrearHorario()">Asignar Clase</button>` : `<button class="btn btn-primary" onclick="abrirModalCrearNota()">Registrar nota</button>`}
    </div>
    <div class="horario-container"><div class="horario-grid">${html}</div></div>
  `;
}
